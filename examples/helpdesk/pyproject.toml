[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name            = "helpdesk-example"
version         = "0.1.0"
description     = "A complete multi-tenant helpdesk API built on fastapi-tenancy."
readme          = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "fastapi-tenancy[postgres]",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "asgi-lifespan>=2.1",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.6",
    "mypy>=1.11",
]

# The example is deliberately its own uv project: it must not add test or
# runtime dependencies to the library, and it should prove the library works
# when consumed the way a real application consumes it — from a lockfile,
# against the published extras.
[tool.uv.sources]
fastapi-tenancy = { path = "../..", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/helpdesk"]

[tool.pytest.ini_options]
asyncio_mode     = "auto"
testpaths        = ["tests"]
addopts          = ["--tb=short", "--strict-markers"]
markers = [
    "e2e: requires a live PostgreSQL container (started automatically)",
]

[tool.ruff]
line-length    = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF", "PT", "D"]
ignore = ["D100", "D104", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party           = ["helpdesk"]
force-sort-within-sections  = true

[tool.mypy]
python_version = "3.11"
strict         = true
plugins        = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
